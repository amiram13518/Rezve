<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rezve — هوش مصنوعی گفتگو‌محور</title>
<style>
:root{--bg:#fff;--surface:#f9f8f7;--line:#e6e5e3;--ink:#2c2c2b;--muted:#7d7a75;--blue:#2783de;--blue-soft:#e5f2fc;--nav:#fbfaf9}
*{box-sizing:border-box} body{margin:0;color:var(--ink);font-family:Tahoma,Arial,"Noto Sans Arabic",sans-serif;background:var(--bg);font-size:14px} button{font:inherit;cursor:pointer} .app{min-height:100vh;display:grid;grid-template-columns:270px 1fr;direction:ltr}.side{direction:rtl;background:var(--nav);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;font-family:Arial,sans-serif;direction:ltr;font-size:21px;font-weight:700;letter-spacing:-.7px}.mark{display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#2783de;color:white;font-size:19px;font-weight:400;box-shadow:0 4px 10px #2783de31}.new{border:1px solid var(--line);color:var(--ink);background:white;border-radius:8px;padding:11px 12px;width:100%;text-align:right;font-weight:600;display:flex;align-items:center;justify-content:space-between}.new:hover{background:var(--surface)}.plus{font-size:21px;font-weight:300;color:var(--blue)}.label{color:var(--muted);font-size:12px;padding:0 8px}.history{display:flex;flex-direction:column;gap:3px}.chat{border:0;background:transparent;border-radius:7px;padding:10px 9px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#504e4a}.chat:hover,.chat.active{background:#eeecea}.chat.active{font-weight:600}.bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:13px;display:flex;gap:10px;align-items:center}.avatar{background:#e5f2fc;color:#236cae;width:31px;height:31px;border-radius:50%;display:grid;place-items:center;font-weight:700}.account{line-height:1.25}.account b{font-size:13px}.account small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.main{direction:rtl;display:flex;flex-direction:column;min-width:0}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.model{display:flex;align-items:center;gap:8px;font-weight:600}.dot{width:8px;height:8px;border-radius:50%;background:#46a171}.icons{display:flex;gap:8px}.icon{background:transparent;border:0;width:36px;height:36px;border-radius:7px;color:#696661;font-size:17px}.icon:hover{background:var(--surface)}.conversation{width:min(780px,calc(100% - 48px));margin:0 auto;flex:1;padding:54px 0 164px}.hello{margin-bottom:46px}.hello h1{font:700 32px/1.4 Arial,Tahoma,sans-serif;letter-spacing:-.6px;margin:0 0 9px}.hello p{margin:0;color:var(--muted);font-size:16px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}.suggest{border:1px solid var(--line);background:white;border-radius:10px;padding:14px;text-align:right;line-height:1.55;color:#4e4b47;transition:.15s}.suggest:hover{border-color:#a9cdef;background:#fbfdff}.suggest span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.message{display:flex;gap:12px;margin:26px 0;align-items:flex-start}.bot{background:var(--blue);color:white;width:30px;height:30px;min-width:30px;border-radius:8px;display:grid;place-items:center;font-family:Arial;font-weight:bold}.bubble{line-height:1.95;padding-top:1px}.bubble strong{display:block;font-family:Arial,Tahoma,sans-serif;margin-bottom:4px}.compose-wrap{position:fixed;bottom:0;left:270px;right:0;background:linear-gradient(transparent,#fff 25%);padding:48px 24px 22px}.compose{max-width:780px;margin:auto;border:1px solid #d8d6d3;background:white;border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:flex-end;gap:10px;box-shadow:0 3px 14px #25211b0c}.compose textarea{border:0;outline:0;resize:none;flex:1;font:15px/1.5 Tahoma,Arial;height:29px;padding:3px;color:var(--ink)}.send{border:0;background:var(--blue);color:white;width:34px;height:34px;border-radius:8px;font-size:17px}.send:disabled{opacity:.45}.note{text-align:center;color:#999691;font-size:11px;margin-top:10px}.mobile-menu{display:none}@media(max-width:720px){.app{display:block}.side{display:none}.top{height:58px;padding:0 16px}.mobile-menu{display:block}.conversation{width:calc(100% - 32px);padding-top:37px;padding-bottom:145px}.hello h1{font-size:27px}.suggestions{grid-template-columns:1fr}.compose-wrap{left:0;padding:35px 16px 16px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><span class="mark">R</span>rezve</div><button class="new" onclick="newChat()"><span>گفتگوی جدید</span><span class="plus">＋</span></button><div class="label">گفتگوهای اخیر</div><nav class="history" id="history"><button class="chat active">ایده‌پردازی برای کسب‌وکار</button><button class="chat">برنامه‌ریزی سفر استانبول</button><button class="chat">یادگیری زبان انگلیسی</button></nav><div class="bottom"><div class="avatar">A</div><div class="account"><b>Amir</b><small>حساب حرفه‌ای</small></div></div></aside>
<main class="main"><header class="top"><button class="icon mobile-menu">☰</button><div class="model"><span class="dot"></span>Rezve AI <span style="color:#aaa">⌄</span></div><div class="icons"><button class="icon" title="حالت شب">◐</button><button class="icon" title="تنظیمات">⚙</button></div></header><section class="conversation" id="conversation"><div class="hello"><h1>سلام امیر، چطور می‌توانم کمک کنم؟</h1><p>به Rezve خوش آمدید؛ یک همراه هوشمند برای فکر کردن، نوشتن و ساختن.</p><div class="suggestions"><button class="suggest" onclick="useSuggestion(this)">برای یک محصول جدید ایده‌پردازی کن<span>از مسئله تا پیشنهادهای قابل اجرا</span></button><button class="suggest" onclick="useSuggestion(this)">یک متن حرفه‌ای بنویس<span>ایمیل، پست یا برنامه‌ی کاری</span></button><button class="suggest" onclick="useSuggestion(this)">مطلبی را خلاصه کن<span>نکات کلیدی و گام‌های بعدی</span></button><button class="suggest" onclick="useSuggestion(this)">کمکم کن یاد بگیرم<span>مفاهیم را قدم‌به‌قدم توضیح بده</span></button></div></div><div class="message"><div class="bot">R</div><div class="bubble"><strong>Rezve</strong>می‌توانید به فارسی یا English با من صحبت کنید. از کجا شروع کنیم؟</div></div></section><div class="compose-wrap"><div class="compose"><textarea id="prompt" placeholder="پیامتان را برای Rezve بنویسید…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button class="send" onclick="send()" title="ارسال">↑</button></div><div class="note">Rezve ممکن است اشتباه کند. اطلاعات مهم را بررسی کنید.</div></div></main>
</div>
<script>
const prompt=document.getElementById('prompt'), conversation=document.getElementById('conversation'), history=document.getElementById('history');
function newChat(){document.querySelectorAll('.chat').forEach(x=>x.classList.remove('active'));prompt.focus();window.scrollTo(0,0)}
function useSuggestion(el){prompt.value=el.firstChild.textContent.trim();prompt.focus()}
function send(){const text=prompt.value.trim();if(!text)return;const title=text.length>30?text.slice(0,30)+'…':text;document.querySelectorAll('.chat').forEach(x=>x.classList.remove('active'));const item=document.createElement('button');item.className='chat active';item.textContent=title;history.prepend(item);const mine=document.createElement('div');mine.className='message';mine.style.justifyContent='flex-start';mine.innerHTML='<div class="bubble" style="background:#f0efed;padding:9px 13px;border-radius:10px;max-width:80%">'+escapeHtml(text)+'</div>';conversation.appendChild(mine);const reply=document.createElement('div');reply.className='message';reply.innerHTML='<div class="bot">R</div><div class="bubble"><strong>Rezve</strong><span class="typing">در حال آماده‌سازی پاسخ…</span></div>';conversation.appendChild(reply);prompt.value='';reply.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{reply.querySelector('.typing').textContent='در نسخه‌ی نهایی، پاسخ زنده از مدل هوش مصنوعی دریافت می‌شود. اتصال امن API و ذخیره‌سازی تاریخچه برای حساب شما در سمت سرور انجام خواهد شد.'},650)}
function escapeHtml(t){return t.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script>
</body></html>
